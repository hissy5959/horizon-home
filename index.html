<!DOCTYPE html>
<!-- HORIZON HOME build: 2026-10-26 note-notify2 (YouTube廃止・軽量モード削除済み) -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HORIZON HOME">
<title>HORIZON HOME</title>
<style>
  :root{
    --panel:rgba(10,22,40,.58);
    --panel-dark:rgba(5,10,20,.72);
    --line:rgba(255,255,255,.18);
    --text:#eef6ff;
    --muted:#a9c2da;
    --accent:#9fc3e8;
    --good:#9fe8b1;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    height:100vh;height:100svh;
    margin:0;padding:14px;overflow:hidden;color:var(--text);
    padding-top:max(14px,env(safe-area-inset-top));padding-right:max(14px,env(safe-area-inset-right));
    padding-bottom:max(14px,env(safe-area-inset-bottom));padding-left:max(14px,env(safe-area-inset-left));
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    background:#1b2a44;
  }
  /* 背景レイヤー（天気×時間帯で選ばれた写真をクロスフェード） */
  .bgLayer{position:fixed;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 2.5s ease;z-index:0}
  #bgFallback{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,#2c3e63,#7a5570 55%,#31435f)}
  #dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:5;transition:opacity 3s ease}
  #app{position:relative;z-index:2;display:flex;flex-direction:column;height:100%;gap:10px}

  .glass{background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(4px)}
  .label{font-size:11px;color:var(--muted);letter-spacing:.12em}

  /* 上部バー */
  #topbar{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-radius:12px}
  #clock{font-size:22px;font-weight:800}
  #date{font-size:12px;color:#c8d8ea;margin-left:10px}
  #dimNote{font-size:10px;color:#8fa9c4;margin-left:10px}
  #topRight{display:flex;align-items:center;gap:10px;font-size:13px}
  #saleBanner{display:none;background:#e88f2a;color:#23160a;border-radius:999px;padding:3px 10px;font-weight:700;font-size:11px}
  #miniWeather{display:flex;align-items:center;gap:5px}
  #miniWeather svg{width:18px;height:18px}

  /* メイン2カラム */
  #main{display:grid;grid-template-columns:1fr 1.25fr;gap:10px;flex:1;min-height:0;align-items:start}
  #weather{padding:14px;display:flex;flex-direction:column;overflow:hidden}
  #wNow{display:flex;align-items:center;gap:12px;margin-top:6px}
  #wIcon svg{width:56px;height:56px}
  #wTemp{font-size:44px;font-weight:800}
  #wDetails{font-size:12px;color:#c8d8ea;line-height:1.7;margin-top:4px}
  #weeklySlide{margin-top:12px;border-top:1px solid rgba(255,255,255,.1);padding-top:8px}
  #weeklyView{overflow:hidden;margin-top:5px}
  #weeklyTrack{display:inline-flex;white-space:nowrap;animation:tick 38s linear infinite;font-size:12.5px;padding:2px 0}
  #weeklyTrack span{margin-right:26px}
  #weeklyTrack svg{width:16px;height:16px;vertical-align:-3px}
  #weeklyTrack .pop{color:var(--accent)}

  #infoPanel{background:var(--panel-dark);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;align-self:start;min-height:0}
  #card{display:block;text-decoration:none;color:var(--text);margin-top:12px;cursor:pointer}
  #cardCat{display:inline-block;background:#33506e;color:#dcebfb;border-radius:999px;padding:3px 12px;font-weight:800;font-size:12px}
  #cardCat.sale{background:#e88f2a;color:#23160a}
  #cardImg{position:relative;height:170px;border-radius:10px;overflow:hidden;background-color:#0a1526;background-size:cover;background-position:center}
  #cardImg #cardCat{position:absolute;left:10px;bottom:10px}
  #cardTitle{font-size:24px;font-weight:800;line-height:1.5;margin-top:12px;min-height:72px}
  #cardMeta{font-size:12px;color:var(--muted);margin-top:10px}
  #cardDots{margin-top:12px;font-size:9px;color:var(--muted);letter-spacing:.3em;min-height:12px}
  #raceStrip{margin-top:10px;font-size:11px;color:#c8d8ea;background:rgba(255,255,255,.07);border-radius:8px;padding:6px 9px}

  /* スマートホーム帯 */
  #smarthome{display:flex;gap:10px;align-items:stretch;padding:10px 14px;flex-shrink:0}
  #room{min-width:180px}
  #roomTemp{font-size:20px;font-weight:800}
  #roomTemp .hum{font-size:14px;font-weight:600}
  #comfort{font-size:11px;color:var(--good)}
  #comfort.unset{color:var(--muted)}
  #appliances{flex:1;display:flex;gap:8px}
  .appliance{flex:1;background:rgba(255,255,255,.1);border:1px solid transparent;border-radius:10px;color:var(--text);font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:9px 0;font-family:inherit}
  .appliance:active{background:rgba(255,255,255,.22)}
  .appliance .sub{display:flex;gap:4px}
  .appliance .sub button{background:rgba(255,255,255,.14);border:0;color:var(--text);border-radius:6px;padding:3px 10px;font-size:11px;cursor:pointer;font-family:inherit}

  /* ニュースティッカー（色は全体に合わせて濃紺） */
  #ticker{display:flex;align-items:center;border-radius:10px;overflow:hidden}
  #tickerLabel{background:#33506e;color:#dcebfb;font-size:11px;font-weight:800;padding:8px 10px;white-space:nowrap}
  #tickerView{overflow:hidden;flex:1}
  #noteDraftBanner{margin-top:10px;padding:11px 16px;border-radius:12px;background:rgba(65,184,131,.20);border:1px solid rgba(65,184,131,.55);color:#eafff3;font-size:16px;font-weight:700;cursor:pointer}
  #tickerTrack{display:inline-flex;white-space:nowrap;animation:tick 60s linear infinite;padding:7px 0;font-size:12px}
  #ticker.paused #tickerTrack{animation-play-state:paused}
  #tickerTrack a{color:var(--text);text-decoration:none;margin-right:28px}
  #tickerTrack a b{color:var(--accent);font-weight:700}
  @keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}

  #toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:rgba(5,10,20,.9);border:1px solid var(--line);color:var(--text);padding:8px 14px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:9}

</style>
</head>
<body>
<div id="bgFallback"></div>
<div id="bgA" class="bgLayer"></div>
<div id="bgB" class="bgLayer"></div>
<div id="dim"></div>

<div id="app">
  <header id="topbar" class="glass">
    <div><span id="clock">--:--</span><span id="date"></span><span id="dimNote">夜22時〜自動減光</span></div>
    <div id="topRight">
      <span id="saleBanner"></span>
      <span id="miniWeather"><span id="miniIcon"></span><span id="miniText">京都 --°</span></span>
    </div>
  </header>

  <div id="ticker" class="glass">
    <div id="tickerLabel">NEWS</div>
    <div id="tickerView"><div id="tickerTrack"><a>ニュースを取得中…</a></div></div>
  </div>

  <div id="noteDraftBanner" hidden>📝 noteの下書きができました「<span id="noteDraftTitle"></span>」— タップで開く</div>

  <div id="main">
    <section id="weather" class="glass">
      <div class="label">WEATHER ・ 京都</div>
      <div id="wNow"><span id="wIcon"></span><span id="wTemp">--°</span></div>
      <div id="wDetails">天気を取得中…</div>
      <div id="weeklySlide">
        <div class="label">週間予報</div>
        <div id="weeklyView"><div id="weeklyTrack"></div></div>
      </div>
    </section>

    <section id="infoPanel">
      <div class="label">NEWS ＆ SALE</div>
      <a id="card" target="_blank" rel="noopener">
        <div id="cardImg"><span id="cardCat" class="news">ニュース</span></div>
        <div id="cardTitle">ニュースを取得中…</div>
        <div id="cardMeta"></div>
      </a>
      <div id="cardDots"></div>
      <div id="raceStrip">競馬カレンダー：読み込み中…</div>
    </section>
  </div>

  <section id="smarthome" class="glass">
    <div id="room">
      <div class="label">自分の部屋 ・ 室内</div>
      <div id="roomTemp">--.-° <span class="hum">湿度 --%</span></div>
      <div id="comfort" class="unset">温湿度は未設定です</div>
    </div>
    <div id="appliances">
      <button class="appliance" data-scene="light">照明</button>
      <button class="appliance" data-scene="tv">テレビ</button>
      <div class="appliance" style="cursor:default">エアコン
        <span class="sub">
          <button data-scene="airconOn">ON</button>
          <button data-scene="airconOff">OFF</button>
        </span>
      </div>
    </div>
  </section>
</div>
<div id="toast"></div>

<script>
/* ============================================================
   HORIZON HOME 設定（ここだけ編集すれば大抵のことは済みます）
   ============================================================ */
const CONFIG = {
  // 天気の場所（京都）
  lat: 35.0116, lon: 135.7681, placeName: '京都',



  // 競馬カレンダー（下の帯に次の発走を表示するための設定）
  jra: {
    enabled: true,
    beforeMin: 5,  // 発走の何分前から
    afterMin: 5,   // 発走の何分後まで
    // 開催日ごとの発走時刻リスト [時刻, レース名]
    // 対象は「その日の開催場すべて」でも「京都だけ」でもOK（時刻順に並べる）
    raceDays: {
      '2026-10-25': [
        ['11:30','京都4R'],['12:20','京都5R'],['12:50','京都6R'],
        ['13:20','京都7R'],['13:50','京都8R'],['14:25','京都9R'],
        ['15:00','京都10R'],['15:40','京都11R 菊花賞'],['16:30','京都12R'],
      ],
      // '2026-11-01': [['15:40','東京11R 天皇賞（秋）']],
    },
  },

  // 重賞カレンダー（下の帯に出す「次の重賞」）
  gradedRaces: [
    { date:'2026-10-25', name:'菊花賞', grade:'GⅠ', venue:'京都', time:'15:40' },
    { date:'2026-11-01', name:'天皇賞（秋）', grade:'GⅠ', venue:'東京', time:'' },
    // 以降は分かったものから追加してください
  ],

  // Amazonの大型セール（期間中だけ上部にバナーを表示）
  saleEvents: [
    // { name:'ブラックフライデー', start:'2026-11-27', end:'2026-12-01' },
  ],

  // Siriショートカットの名前（SwitchBotのシーンをショートカット化した名前）
  // 空のままだと、ボタンを押したときに案内が出ます。
  shortcuts: {
    light: '照明オンオフ',
    tv: 'テレビオンオフ',
    airconOn: 'エアコンON',
    airconOff: 'エアコンOFF',
  },

  // ニュース取得に使う中継（任意）。自前のWorkerを使う場合は
  // 'https://あなたのWorker/rss?url=' のように末尾を ?url= にして指定。
  // 指定した中継が失敗した場合は公開プロキシ（allorigins → codetabs）へ順に切り替えます。
  newsProxyPrefix: 'https://horizon-home-proxy.hissy5599.workers.dev/rss?url=',

  // 室内の温湿度（SwitchBot中継URL。cloudflare-worker.js 参照）
  // 例: 'https://horizon-home-proxy.example.workers.dev/'
  // 空のままだと室温・湿度は「未設定」表示になります。
  // ※ SwitchBotのトークン/シークレットをこのファイルに直接書かないこと！
  roomProxyUrl: 'https://horizon-home-proxy.hissy5599.workers.dev/',

  // 背景写真プール（Unsplash）。天気×時間帯でグループが選ばれ、その中からランダム表示。
  backgrounds: {
    clearDay:  ['photo-1500382017468-9049fed747ef','photo-1507525428034-b723cf961d3e','photo-1469474968028-56623f02e42e','photo-1441974231531-c6227db76b6e'],
    clearDusk: ['photo-1506905925346-21bda4d32df4','photo-1472214103451-9374bd1c798e','photo-1500530855697-b586d89ba3ee'],
    night:     ['photo-1519681393784-d120267933ba','photo-1419242902214-272b3f66ee7a','photo-1514565131-fce0801e5785'],
    cloudyDay: ['photo-1470071459604-3b5ec3a7fe05','photo-1447752875215-b2761acb3c5d','photo-1503435980610-a51f3ddfee50'],
    cloudyDusk:['photo-1470071459604-3b5ec3a7fe05','photo-1500530855697-b586d89ba3ee'],
    rainDay:   ['photo-1433086966358-54859d0ed716','photo-1518837695005-2083093ee35b','photo-1470071459604-3b5ec3a7fe05'],
    rainDusk:  ['photo-1433086966358-54859d0ed716','photo-1519501025264-65ba15a82390'],
    snowDay:   ['photo-1519681393784-d120267933ba','photo-1470071459604-3b5ec3a7fe05'],
    snowDusk:  ['photo-1519681393784-d120267933ba'],
  },
};
const UNSPLASH = id => `https://images.unsplash.com/${id}?q=80&w=1600&auto=format&fit=crop`;

/* ---------- 天気アイコン（SVG） ---------- */
const ICONS = {
  sun: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="#ffd76a"/><g stroke="#ffd76a" stroke-width="2" stroke-linecap="round"><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></g></svg>',
  sunCloud: '<svg viewBox="0 0 24 24"><circle cx="8" cy="7" r="3.4" fill="#ffd76a"/><path d="M8 21a4.5 4.5 0 1 1 .7-8.93A5.5 5.5 0 0 1 19.2 13 3.9 3.9 0 0 1 18.5 21H8z" fill="#cfd8e3"/></svg>',
  cloud: '<svg viewBox="0 0 24 24"><path d="M7 19a5 5 0 1 1 .8-9.92A6 6 0 0 1 19.5 11 4.25 4.25 0 0 1 18.5 19H7z" fill="#cfd8e3"/></svg>',
  fog: '<svg viewBox="0 0 24 24"><path d="M7 13a5 5 0 1 1 .8-9.92A6 6 0 0 1 19.5 5 4.25 4.25 0 0 1 18.5 13H7z" fill="#cfd8e3"/><g stroke="#9fb6cc" stroke-width="1.8" stroke-linecap="round"><path d="M5 17h14M7 21h10"/></g></svg>',
  drizzle: '<svg viewBox="0 0 24 24"><path d="M7 15a5 5 0 1 1 .8-9.92A6 6 0 0 1 19.5 7 4.25 4.25 0 0 1 18.5 15H7z" fill="#cfd8e3"/><g stroke="#6ec3ff" stroke-width="1.8" stroke-linecap="round"><path d="M9 18.5h.01M13 18.5h.01M17 18.5h.01M11 21.5h.01M15 21.5h.01"/></g></svg>',
  rain: '<svg viewBox="0 0 24 24"><path d="M7 15a5 5 0 1 1 .8-9.92A6 6 0 0 1 19.5 7 4.25 4.25 0 0 1 18.5 15H7z" fill="#cfd8e3"/><path d="M8 17.5l-1.2 2.5M13 17.5l-1.2 2.5M18 17.5l-1.2 2.5" stroke="#6ec3ff" stroke-width="1.8" stroke-linecap="round"/></svg>',
  snow: '<svg viewBox="0 0 24 24"><path d="M7 15a5 5 0 1 1 .8-9.92A6 6 0 0 1 19.5 7 4.25 4.25 0 0 1 18.5 15H7z" fill="#cfd8e3"/><g fill="#eaf4ff"><circle cx="8.5" cy="19" r="1.3"/><circle cx="13" cy="21" r="1.3"/><circle cx="17.5" cy="19" r="1.3"/></g></svg>',
  thunder: '<svg viewBox="0 0 24 24"><path d="M7 14a5 5 0 1 1 .8-9.92A6 6 0 0 1 19.5 6 4.25 4.25 0 0 1 18.5 14H7z" fill="#cfd8e3"/><path d="M12.5 13.5L9.8 18h2.4l-1.5 4 4.3-5.4h-2.5l1.7-3.1h-1.7z" fill="#ffd76a"/></svg>',
};
function iconFor(code){
  if (code === 0) return ICONS.sun;
  if (code === 1) return ICONS.sunCloud;
  if (code === 2 || code === 3) return ICONS.cloud;
  if (code === 45 || code === 48) return ICONS.fog;
  if (code >= 51 && code <= 57) return ICONS.drizzle;
  if ((code >= 61 && code <= 67) || (code >= 80 && code <= 82)) return ICONS.rain;
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return ICONS.snow;
  if (code >= 95) return ICONS.thunder;
  return ICONS.cloud;
}
function groupFor(code){ // 背景用の天気グループ
  if (code === 0 || code === 1) return 'clear';
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return 'snow';
  if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82) || code >= 95) return 'rain';
  return 'cloudy';
}

/* ---------- 小物 ---------- */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const todayKey = (d=new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
let toastTimer = null;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.style.opacity = 1;
  clearTimeout(toastTimer); toastTimer = setTimeout(()=> t.style.opacity = 0, 2600);
}

/* ---------- 時計と夜間減光 ---------- */
function tickClock(){
  const now = new Date();
  $('#clock').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const w = ['日','月','火','水','木','金','土'][now.getDay()];
  $('#date').textContent = `${now.getMonth()+1}月${now.getDate()}日（${w}）`;
  // 減光: 22:00〜6:00 を最大0.42、30分かけて出入り
  const mins = now.getHours()*60 + now.getMinutes();
  const ramp = (start, len) => Math.min(1, Math.max(0, (mins - start) / len));
  let o = 0;
  if (mins >= 22*60) o = ramp(22*60, 30);
  else if (mins < 6*60) o = 1 - ramp(5*60+30, 30);
  $('#dim').style.opacity = (o * 0.42).toFixed(2);
}
setInterval(tickClock, 1000); tickClock();

/* ---------- 天気（Open-Meteo） ---------- */
let weatherState = null; // {code, sunrise, sunset}
async function loadWeather(){
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.lat}&longitude=${CONFIG.lon}` +
    `&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m` +
    `&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_probability_max` +
    `&timezone=Asia%2FTokyo&forecast_days=8`;
  try {
    const res = await fetch(url); const d = await res.json();
    const c = d.current, dy = d.daily;
    weatherState = { code: c.weather_code, sunrise: dy.sunrise[0], sunset: dy.sunset[0] };
    $('#wIcon').innerHTML = iconFor(c.weather_code);
    $('#wTemp').textContent = `${Math.round(c.temperature_2m)}°`;
    $('#miniIcon').innerHTML = iconFor(c.weather_code);
    $('#miniText').textContent = `${CONFIG.placeName} ${Math.round(c.temperature_2m)}°`;
    $('#wDetails').innerHTML =
      `体感 ${Math.round(c.apparent_temperature)}° ・ 湿度 ${c.relative_humidity_2m}% ・ 高 ${Math.round(dy.temperature_2m_max[0])}° / 低 ${Math.round(dy.temperature_2m_min[0])}°<br>` +
      `降水確率 ${dy.precipitation_probability_max[0] ?? '--'}% ・ 風 ${Math.round(c.wind_speed_10m)}m/s`;
    // 週間予報（明日からの7日分をパネル内でスライド表示）
    const wd = ['日','月','火','水','木','金','土'];
    let wk = '';
    for (let i = 1; i <= 7 && i < dy.time.length; i++){
      const dt = new Date(dy.time[i] + 'T00:00:00');
      const label = `${dt.getMonth()+1}/${dt.getDate()}（${wd[dt.getDay()]}）`;
      const pop = dy.precipitation_probability_max[i];
      wk += `<span>${label} ${iconFor(dy.weather_code[i])} ${Math.round(dy.temperature_2m_max[i])}° / ${Math.round(dy.temperature_2m_min[i])}°${pop != null && pop >= 30 ? ` <span class="pop">降水 ${pop}%</span>` : ''}</span>`;
    }
    $('#weeklyTrack').innerHTML = wk + wk; // 2周分つないで無限ループ
    updateBackground(true);
  } catch(e) {
    $('#wDetails').textContent = '天気を取得できませんでした（通信を確認してください）';
  }
}
loadWeather(); setInterval(loadWeather, 15*60*1000);

/* ---------- 背景（天気×時間帯でプールからランダム） ---------- */
let bgFlip = false, lastBg = localStorage.getItem('hh-last-bg') || '';
function daypart(){
  if (!weatherState) { const h = new Date().getHours(); return (h>=6&&h<17)?'Day':(h>=17&&h<19)?'Dusk':'Night'; }
  const now = new Date();
  const sr = new Date(weatherState.sunrise), ss = new Date(weatherState.sunset);
  const m = 60*1000;
  if (now < new Date(sr - 30*m) || now >= new Date(ss.getTime() + 30*m)) return 'Night';
  if (now < new Date(sr.getTime() + 60*m)) return 'Dusk'; // 朝焼けも夕方プールで代用
  if (now >= new Date(ss.getTime() - 60*m)) return 'Dusk';
  return 'Day';
}
function updateBackground(force){
  const group = weatherState ? groupFor(weatherState.code) : 'cloudy';
  const dp = daypart();
  const key = dp === 'Night' ? 'night' : group + dp;
  const pool = (CONFIG.backgrounds[key] || CONFIG.backgrounds.cloudyDay || []).map(UNSPLASH);
  if (!pool.length) return;
  let next = pool[Math.floor(Math.random()*pool.length)];
  if (pool.length > 1 && next === lastBg) next = pool[(pool.indexOf(next)+1) % pool.length];
  lastBg = next; localStorage.setItem('hh-last-bg', next);
  const showEl = bgFlip ? $('#bgA') : $('#bgB'), hideEl = bgFlip ? $('#bgB') : $('#bgA');
  const img = new Image();
  img.onload = () => { showEl.style.backgroundImage = `url("${next}")`; showEl.style.opacity = 1; hideEl.style.opacity = 0; bgFlip = !bgFlip; };
  img.onerror = () => { /* 読めなければ今の背景のまま */ };
  img.src = next;
}
setInterval(()=> updateBackground(false), 30*60*1000);

let cardItems = [], cardIdx = 0, cardTimer = null;
const CARD_IMAGES = {

kyoto: ['photo-1493976040374-85c8e12f0c0e','photo-1545569341-9eb8b30979d9','photo-1528360983277-13d401cdc186','photo-1524413840807-0c3cb6fa808d'],
ai: ['photo-1677442136019-21780ecad995','photo-1620712943543-bcc4688e7485','photo-1555255707-c07966088b7b','photo-1535378917042-10a22c95931a'],
game: ['photo-1511512578047-dfb367046420','photo-1493711662062-fa541adb3fc8','photo-1560253023-3ec5d502959f','photo-1550745165-9bc0b252726f'],
gadget: ['photo-1498049794561-7780e7231661','photo-1519389950473-47ba0277781c','photo-1531297484001-80022131f5a1','photo-1550745165-9bc0b252726f'],
keiba: ['photo-1553284965-83fd3e82fa5a','photo-1450052590821-8bf91254a353','photo-1534773728080-33d31da27ae5'],
sale: ['photo-1472851294608-062f824d29cc','photo-1483985988355-763728e1935b','photo-1441986300917-64674bd600d8','photo-1556742049-0cfed4f6a45d'],
};
let lastCardImg = '';
function relTime(d){
const t = d instanceof Date ? d.getTime() : new Date(d).getTime();
const m = Math.max(1, Math.round((Date.now() - t) / 60000));
if (m < 60) return `${m}分前`;
const h = Math.round(m / 60);
return h < 24 ? `${h}時間前` : `${Math.round(h / 24)}日前`;
}
function showCard(){
if (!cardItems.length) return;
const pos = cardIdx % cardItems.length;
const i = cardItems[pos];
cardIdx++;
const cat = $('#cardCat');
cat.textContent = i.label;
cat.className = i.cat === 'sale' ? 'sale' : 'news';

let imgId = pool[Math.floor(Math.random()*pool.length)];
if (pool.length > 1 && imgId === lastCardImg) imgId = pool[(pool.indexOf(imgId)+1) % pool.length];

const p = pos % total;
$('#cardDots').textContent = Array.from({length: total}, (_, k) => k === p ? '●' : '○').join('');
}
function setCardItems(items){
if (!items || !items.length) return;
cardItems = items;
if (cardTimer) clearInterval(cardTimer);
cardIdx = 0;
showCard();

}

/* ---------- ニュース（Google News RSSをallorigins経由で取得） ---------- */
const NEWS_FEEDS = [
{ key:'top', label:'トップ', url:'https://news.google.com/rss?hl=ja&gl=JP&ceid=JP:ja'},
{ key:'kyoto', label:'京都', url:gnSearch('京都 when:1d')},
{ key:'ai', label:'AI', url:gnSearch('AI when:1d')},
{ key:'game', label:'ゲーム', url:gnSearch('ゲーム when:1d')},
{ key:'gadget',label:'ガジェット',url:gnSearch('ガジェット when:1d')},
{ key:'keiba', label:'競馬', url:gnSearch('競馬 when:1d')},
{ key:'sale', label:'セール', url:gnSearch('Amazon セール when:7d')},
];
function gnSearch(q){ return `https://news.google.com/rss/search?q=${encodeURIComponent(q)}&hl=ja&gl=JP&ceid=JP:ja`;}
// ティッカー10本あたりの配分：トップ3・京都2・他は各1
const NEWS_PATTERN = ['top','top','top','kyoto','kyoto','ai','game','gadget','keiba','sale'];
const NEWS_EXCLUDE = { gadget:['攻略']}; // 「ガジェット」違い（ゲーム内用語など）を落とす

const sleep = ms => new Promise(r => setTimeout(r, ms));
async function fetchWithTimeout(url, ms){
const ctl = new AbortController();
const timer = setTimeout(()=> ctl.abort(), ms);
try { return await fetch(url, { signal: ctl.signal, cache: 'no-store' }); }
finally { clearTimeout(timer); }
}
async function fetchViaProxies(url){
const pubProxies = ['https://api.allorigins.win/raw?url=', 'https://api.codetabs.com/v1/proxy?quest='];
const prefixes = CONFIG.newsProxyPrefix
? [CONFIG.newsProxyPrefix, ...pubProxies]
: pubProxies;
// 中継が断続的に失敗するため、間隔を空けて最大3周まで再試行する
for (let round = 0; round < 3; round++){
for (const p of prefixes){
try {
const res = await fetchWithTimeout(p + encodeURIComponent(url), 20000);
if (!res.ok) continue;
const text = await res.text();
if (text.includes('<item>')) return text;
} catch(e) { /* 次の中継・次の周回を試す */ }
}
if (round < 2) await sleep(2500);
}
throw new Error('all proxies failed');
}
async function fetchFeed(feed){
const text = await fetchViaProxies(feed.url);
const xml = new DOMParser().parseFromString(text, 'text/xml');
const items = [];
xml.querySelectorAll('item').forEach(it => {
const title = it.querySelector('title')?.textContent?.trim();
const link = it.querySelector('link')?.textContent?.trim();
const date = new Date(it.querySelector('pubDate')?.textContent || 0);
if (title && link) items.push({ title, link, date, cat: feed.key, label: feed.label});
});
const ex = NEWS_EXCLUDE[feed.key] || [];
return items.filter(i =>!ex.some(w => i.title.includes(w)))
.sort((a,b)=> b.date - a.date).slice(0, 12);
}
const NEWS_CACHE_KEY = 'hh-news-cache-v1';
function tickerAnchor(i){
return `<a href="${i.link}" target="_blank" rel="noopener"><b>【${i.label}】</b>${String(i.title).replace(/</g,'&lt;')}</a>`;
}
function renderTicker(items){
const track = $('#tickerTrack');
const html = items.map(tickerAnchor).join('');
track.innerHTML = html + html; // 2周分つないで無限ループ
track.style.animationDuration = `${Math.max(40, items.length * 6)}s`; // 目安: 1本あたり6秒
track.dataset.loaded = '1';
}
function restoreNewsCache(){
try {
const cache = JSON.parse(localStorage.getItem(NEWS_CACHE_KEY) || 'null');
if (cache && Array.isArray(cache.items) && cache.items.length){ renderTicker(cache.items); setCardItems(cache.items.map(i => ({ ...i, date: i.date ? new Date(i.date) : new Date() }))); }
} catch(e) {}
}
async function loadNews(){
// 中継への負荷を下げるため、同時に取りに行くのは2本まで
const results = new Array(NEWS_FEEDS.length);
let cursor = 0;
async function worker(){
while (cursor < NEWS_FEEDS.length){
const i = cursor++;
try { results[i] = { status:'fulfilled', value: await fetchFeed(NEWS_FEEDS[i]) }; }
catch(e){ results[i] = { status:'rejected', reason: e }; }
}
}
await Promise.all([worker(), worker()]);
const byCat = {};
results.forEach((r,i)=>{ byCat[NEWS_FEEDS[i].key] = r.status==='fulfilled'? r.value: [];});
// 重複除去（正規化した見出しで判定）
const seen = new Set();
for (const k in byCat) byCat[k] = byCat[k].filter(i => {
const key = i.title.replace(/[\s　・「」『』]/g,'').slice(0, 30);
if (seen.has(key)) return false; seen.add(key); return true;
});
// 配分パターンで交互に並べる（足りない枠はトップ→京都で穴埋め）
const queues = JSON.parse(JSON.stringify(byCat));
const picked = [];
const take = k => queues[k] && queues[k].length? picked.push(queues[k].shift()): false;
let guard = 0;
while (picked.length < 40 && guard++ < 12){
for (const k of NEWS_PATTERN){ if (!take(k)) { take('top') || take('kyoto');}}
if (Object.values(queues).every(q =>!q.length)) break;
}
if (!picked.length){ if (!$('#tickerTrack').dataset.loaded) $('#tickerTrack').innerHTML = '<a>ニュースを取得できませんでした</a>'; if (!cardItems.length) $('#cardTitle').textContent = 'ニュースを取得できませんでした'; return;}
renderTicker(picked);
setCardItems(picked);
try { localStorage.setItem(NEWS_CACHE_KEY, JSON.stringify({ at: Date.now(), items: picked.map(i => ({ title: i.title, link: i.link, label: i.label, cat: i.cat, date: i.date ? i.date.toISOString() : null })) })); } catch(e) {}
}
restoreNewsCache(); loadNews(); setInterval(loadNews, 30*60*1000);

// note下書きの合図チェック（Worker の /note-draft を15分ごと）
const NOTE_DRAFT_URL = (CONFIG.roomProxyUrl || '').replace(/\/+$/, '') + '/note-draft';
async function checkNoteDraft(first) {
  if (!CONFIG.roomProxyUrl) return;
  try {
    const r = await fetch(NOTE_DRAFT_URL);
    const d = await r.json();
    if (!d || !d.id) return;
    const seen = localStorage.getItem('noteDraftSeenId');
    if (first) { localStorage.setItem('noteDraftSeenId', d.id); return; }
    if (seen === d.id) return;
    document.getElementById('noteDraftTitle').textContent = d.title;
    const b = document.getElementById('noteDraftBanner');
    b.hidden = false;
    b.onclick = () => {
      localStorage.setItem('noteDraftSeenId', d.id);
      b.hidden = true;
      if (d.url) window.open(d.url, '_blank');
      else window.open('https://note.com/', '_blank');

  } catch (e) { /* 失敗時は黙って次回へ */ }
}
checkNoteDraft(true);

/* レース判定：今日の発走リストから次の発走を出す（下の帯表示用） */
function raceStatus(now = new Date()){
  const list = (CONFIG.jra.raceDays || {})[todayKey(now)] || [];
  const items = list.map(([t, name]) => {
    const [h, m] = t.split(':').map(Number);
    const at = new Date(now); at.setHours(h, m, 0, 0);
    return { at, name, t };
  }).sort((a,b)=> a.at - b.at);
  const before = CONFIG.jra.beforeMin*60000, after = CONFIG.jra.afterMin*60000;
  const live = items.find(i => now >= new Date(i.at - before) && now <= new Date(i.at.getTime() + after));
  const next = items.find(i => i.at > now);
  return { live, next, hasToday: items.length > 0 };
}
function updateRaceStrip(){
const el = $('#raceStrip');
const now = new Date();
const { next, hasToday } = raceStatus(now);
const graded = (CONFIG.gradedRaces||[]).filter(g => g.date >= todayKey(now)).sort((a,b)=> a.date < b.date ? -1 : 1)[0];
let parts = [];
if (hasToday && next) parts.push(`次の発走：${next.name} ${next.t}（あと${Math.max(1, Math.round((next.at - now)/60000))}分）`);
else if (hasToday) parts.push('本日のレースは終了しました');
if (graded){
const isToday = graded.date === todayKey(now);
const d = new Date(graded.date + 'T00:00:00');
parts.push(`${isToday ? '今日' : `${d.getMonth()+1}/${d.getDate()}`}の重賞：${graded.venue} ${graded.name}（${graded.grade}）${graded.time ? ' ' + graded.time + '発走' : ''}`);
}
el.textContent = parts.length ? parts.join(' ・ ') : '次の重賞は未登録です（CONFIG.gradedRaces に追加できます）';
}
setInterval(updateRaceStrip, 20000);
updateRaceStrip();

/* ---------- 室内の温湿度（中継URLから取得） ---------- */
function comfortText(t, h){
  if (h <= 35) return '乾燥気味です。加湿をどうぞ';
  if (h >= 70) return '湿気が多めです。除湿や換気を';
  const di = 0.81*t + 0.01*h*(0.99*t - 14.3) + 46.3; // 不快指数
  if (di >= 80) return '蒸し暑いです。エアコン推奨';
  if (di >= 75) return 'やや暑く感じます';
  if (di < 60) return '少し肌寒いです';
  if (h >= 40 && h <= 65 && di >= 60 && di < 75) return '快適です';
  return 'ふつうの状態です';
}
async function loadRoom(){
  if (!CONFIG.roomProxyUrl) return;
  try {
    const res = await fetch(CONFIG.roomProxyUrl);
    const d = await res.json();
    if (typeof d.temperature !== 'number') return;
    $('#roomTemp').innerHTML = `${d.temperature.toFixed(1)}° <span class="hum">湿度 ${Math.round(d.humidity)}%</span>`;
    const c = $('#comfort');
    c.textContent = `${comfortText(d.temperature, d.humidity)} ・ たった今更新${typeof d.battery === 'number' ? ` ・ 電池 ${d.battery}%` : ''}`;
    c.classList.remove('unset');
  } catch(e) { /* 取れなければ前回の表示のまま */ }
}
loadRoom(); setInterval(loadRoom, 5*60*1000);

});
