<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HORIZON HOME プレビュー：左下ライブカメラ</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    background: #0a1626 url('https://images.unsplash.com/photo-1496442226666-8d4d0e62e6e9?w=1600&q=60') center/cover no-repeat fixed;
    color:#eaf2fb; min-height:100vh;
  }
  #app { display:flex; flex-direction:column; gap:10px; padding:12px; min-height:100vh; }
  .glass { background:rgba(10,25,45,.55); border:1px solid rgba(140,180,230,.25); border-radius:14px; backdrop-filter: blur(6px); }
  .label { font-size:12px; letter-spacing:.18em; color:#9db9d9; font-weight:700; }
  /* 上部バー */
  #topbar { display:flex; align-items:center; gap:18px; padding:8px 16px; }
  #clock { font-size:30px; font-weight:800; }
  #date { font-size:15px; color:#cfe2f7; }
  #topWx { margin-left:auto; font-size:15px; color:#cfe2f7; }
  /* ティッカー */
  #ticker { display:flex; align-items:center; gap:12px; padding:7px 14px; overflow:hidden; white-space:nowrap; }
  #tickerLabel { color:#7fd0ff; font-weight:800; font-size:13px; letter-spacing:.15em; }
  #tickerText { font-size:14px; color:#dbe9fa; }
  /* メイン */
  #main { display:flex; gap:12px; flex:1; align-items:stretch; }
  #leftCol { width:42%; display:flex; flex-direction:column; gap:12px; }
  #weather { padding:16px 18px; }
  #wNow { font-size:52px; font-weight:800; margin:6px 0 2px; }
  #wDetails { font-size:14px; line-height:1.9; color:#d5e5f8; }
  /* ライブカメラ */
  #livecam { padding:10px; display:flex; flex-direction:column; gap:8px; flex:1; }
  #livecamHead { display:flex; align-items:center; gap:8px; padding:0 4px; }
  .liveDot { width:9px; height:9px; border-radius:50%; background:#ff5252; box-shadow:0 0 8px #ff5252; }
  #livecamTitle { font-size:14px; font-weight:700; color:#eaf2fb; }
  #livecamFrame { flex:1; border-radius:10px; overflow:hidden; background:#000; min-height:200px; }
  #livecamFrame iframe { width:100%; height:100%; border:0; display:block; }
  /* 右パネル */
  #infoPanel { flex:1; padding:16px 18px; display:flex; flex-direction:column; }
  #cardImg { height:38%; border-radius:10px; background:url('https://images.unsplash.com/photo-1552820728-b08966b26172?w=1200&q=60') center/cover; margin:10px 0 14px; position:relative; }
  #cardCat { position:absolute; left:10px; bottom:10px; background:#2e7d32; color:#fff; font-size:12px; font-weight:700; padding:3px 10px; border-radius:999px; }
  #cardTitle { font-size:24px; font-weight:800; line-height:1.5; }
  #cardMeta { margin-top:10px; font-size:13px; color:#a9c3e2; }
  #raceStrip { margin-top:auto; padding-top:12px; font-size:14px; color:#cfe2f7; border-top:1px solid rgba(140,180,230,.2); }
  /* 下段帯 */
  #smarthome { display:flex; gap:12px; align-items:stretch; padding:12px 16px; }
  #roomTemp { font-size:24px; font-weight:800; }
  #room .label { margin-bottom:4px; }
  #comfort { font-size:12px; color:#a9c3e2; margin-top:2px; }
  .appliance { flex:1; display:flex; align-items:center; justify-content:center; background:rgba(120,170,230,.14); border:1px solid rgba(140,180,230,.25); border-radius:12px; font-size:17px; font-weight:700; color:#eaf2fb; padding:12px 0; }
</style>
</head>
<body>
<div id="app">
  <header id="topbar" class="glass">
    <div id="clock">21:26</div>
    <div id="date">10月26日（月）</div>
    <div id="topWx">☁ 京都 18°</div>
  </header>

  <div id="ticker" class="glass">
    <div id="tickerLabel">NEWS</div>
    <div id="tickerText">京都のニュース ・ AI ・ ゲーム ・ ガジェット ・ 競馬 …（見出しが流れます）</div>
  </div>

  <div id="main">
    <div id="leftCol">
      <section id="weather" class="glass">
        <div class="label">WEATHER ・ 京都</div>
        <div id="wNow">☁ 18°</div>
        <div id="wDetails">体感 20° ・ 湿度 93% ・ 高 19° / 低 18°<br>降水確率 100% ・ 風 3m/s</div>
      </section>

      <section id="livecam" class="glass">
        <div id="livecamHead">
          <span class="liveDot"></span>
          <span class="label">LIVE CAMERA</span>
          <span id="livecamTitle">嵐山・渡月橋（京都市観光協会）</span>
        </div>
        <div id="livecamFrame">
          <iframe src="https://www.youtube.com/embed/2WB7nCKjijg?autoplay=1&mute=1&playsinline=1&rel=0"
                  allow="autoplay; encrypted-media" allowfullscreen
                  title="嵐山・渡月橋ライブカメラ"></iframe>
        </div>
      </section>
    </div>

    <section id="infoPanel" class="glass">
      <div class="label">NEWS ＆ SALE</div>
      <div id="cardImg"><span id="cardCat">ゲーム</span></div>
      <div id="cardTitle">（ここにニュースカードが入ります）</div>
      <div id="cardMeta">ゲーム ・ 1時間前</div>
      <div id="raceStrip">11/1の重賞：東京 天皇賞（秋）（GI）</div>
    </section>
  </div>

  <section id="smarthome" class="glass">
    <div id="room">
      <div class="label">自分の部屋 ・ 室内</div>
      <div id="roomTemp">23.6° <span style="font-size:15px">湿度 73%</span></div>
      <div id="comfort">湿気が多めです。除湿や換気を</div>
    </div>
    <div class="appliance">照明</div>
    <div class="appliance">テレビ</div>
    <div class="appliance">エアコン ON / OFF</div>
  </section>
</div>
</body>
</html>
